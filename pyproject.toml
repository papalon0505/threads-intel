[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "threads-intel"
version = "0.1.0"
description = "Scrape Threads, Reddit, PTT & more — then analyze with LLM in one pipeline."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Queen Evelyn", email = "papalon0505@users.noreply.github.com"},
]
keywords = ["threads", "scraper", "llm", "intelligence", "meta", "reddit", "ptt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "scrapling>=0.2",
    "jmespath>=1.0",
    "nested-lookup>=0.2",
    "requests>=2.28",
]

[project.urls]
Homepage = "https://github.com/papalon0505/threads-intel"
Repository = "https://github.com/papalon0505/threads-intel"
Issues = "https://github.com/papalon0505/threads-intel/issues"

[project.scripts]
threads-intel = "threads_intel.cli:main"
